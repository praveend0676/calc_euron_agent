<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <h1>Calculator</h1>

    <div class="display">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <!-- Row 1 -->
      <button data-action="clear">C</button>
      <button data-action="sqrt">√</button>
      <button data-action="power">x<sup>y</sup></button>
      <button data-action="mod">%</button>

      <!-- Row 2 -->
      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="÷" data-api="divide">÷</button>

      <!-- Row 3 -->
      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="×" data-api="multiply">×</button>

      <!-- Row 4 -->
      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="-" data-api="subtract">−</button>

      <!-- Row 5 -->
      <button data-num="0">0</button>
      <button data-action="decimal">.</button>
      <button data-action="negate">±</button>
      <button data-op="+" data-api="add">+</button>
    </div>

    <div class="error" id="error"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
